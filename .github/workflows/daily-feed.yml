name: Update public feed

on:
  schedule:
    - cron: "35 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-public-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build candidate feed
        run: python scripts/build_feed.py
      - name: Validate feed schema
        run: python scripts/validate_feed.py feed/latest.json
      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/latest.json
          git diff --cached --quiet || git commit -m "chore: update public feed"
          git push
