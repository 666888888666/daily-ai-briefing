version: 1
policy:
  primary_rule: "同一事件存在多个来源时，优先引用更高 Priority 的原始来源；低 Priority 来源只用于补背景或交叉验证。"
  reliability:
    A: stable
    B: mostly_stable
    C: partial_or_manual
    D: difficult_to_monitor
priorities:
  P0: "Primary Source｜官方 Blog、Changelog、Docs、GitHub、论文、认证官方账号"
  P1: "First-party People｜CEO、核心产品负责人、核心研究员、项目负责人"
  P2: "Builder / Developer｜Zara Follow Builders、独立开发者、一线研究者、GitHub、HN"
  P3: "High-quality Media｜Reuters、Bloomberg、FT、WSJ、财新、晚点"
  P4: "Community｜Reddit、小红书普通用户、微博普通用户、论坛"
  P5: "Aggregation / Repost｜资讯聚合、二次转载、营销号"
